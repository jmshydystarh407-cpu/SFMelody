<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>SF Melody</title>

<style>
    body{
    background-image:url("background.jpg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:white;
    font-family:tahoma;
    text-align:center;
    padding:30px;
    }
}
audio{
    width:90%;
    margin:15px;
}
#site{
    display:none;
}
</style>

</head>

<body>

<div id="login">
<h2>🔒 رمز ورود</h2>
<input id="pass" type="password" placeholder="رمز را وارد کنید">
<br><br>
<button onclick="checkPass()">ورود</button>
<p id="error"></p>
</div>


<div id="site">

<h1>🎵 SF Melody 🎵</h1>

<p>آرشیو اختصاصی ستاره و فرانک</p>

<h2>آهنگ‌ها</h2>

<audio controls>
<source src="song1.mp3" type="audio/mpeg">
</audio>

<br><br>

<audio controls>
<source src="song2.mp3" type="audio/mpeg">
</audio>

</div>


<script>
function checkPass(){

let password = document.getElementById("pass").value;

if(password === "SFM_28011384!"){
document.getElementById("login").style.display="none";
document.getElementById("site").style.display="block";
}
else{
document.getElementById("error").innerHTML="❌ رمز اشتباه است";
}

}
</script>

</body>
</html>
