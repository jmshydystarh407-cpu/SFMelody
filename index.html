<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>SF Melody</title>

<style>
body{
    background-image: url("background.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color:white;
    font-family:tahoma;
    text-align:center;
    padding:30px;
}
}

h1{
    font-size:40px;
    margin-top:30px;
}

.logo{
    font-size:60px;
}

p{
    color:#aaa;
}

button{
    background:#1db954;
    color:white;
    border:none;
    padding:12px 30px;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
}

input{
    padding:12px;
    border-radius:20px;
    border:none;
    text-align:center;
}

#site{
    display:none;
}

audio{
    width:90%;
    margin:20px 0;
}

.music{
    max-width:600px;
    margin:auto;
}

hr{
    border:0;
    border-top:1px solid #333;
}

</style>
</head>

<body>

<div id="login">

<div class="logo">🎧</div>

<h2>SF Melody</h2>

<p>رمز ورود را وارد کنید</p>

<input id="pass" type="password" placeholder="Password">

<br><br>

<button onclick="login()">ورود</button>

<p id="error" style="color:red;"></p>

</div>


<div id="site">

<div class="logo">🎵</div>

<h1>SF Melody</h1>

<p>آرشیو اختصاصی ستاره و فرانک</p>

<div class="music">

<h3>🎶 آهنگ اول</h3>

<audio controls>
<source src="song1.mp3" type="audio/mpeg">
</audio>

<hr>

<h3>🎶 آهنگ دوم</h3>

<audio controls>
<source src="song2.mp3" type="audio/mpeg">
</audio>

</div>

</div>
<br><br>

<audio controls>
<source src="song3.mp3" type="audio/mpeg">
</audio>

<script>

function login(){

let p=document.getElementById("pass").value;

if(p=="SFM_28011384!"){

document.getElementById("login").style.display="none";
document.getElementById("site").style.display="block";

}else{

document.getElementById("error").innerHTML="❌ رمز اشتباه است";

}

}

</script>

</body>
</html>
