<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>SF Melody</title>

<style>
    body{
    background-image: url("background.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color:white;
    }
}

.logo{
    font-size:45px;
    font-weight:bold;
    letter-spacing:3px;
    margin-bottom:10px;
}

.subtitle{
    color:#ccc;
    font-size:18px;
}

.card{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:20px;
    padding:25px;
    margin:25px auto;
    max-width:500px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
}

h2{
    color:#ffd700;
}

audio{
    width:100%;
}

.footer{
    margin-top:40px;
    color:#888;
    font-size:14px;
}
</style>

</head>

<body>

<div class="logo">🎵 SF Melody</div>

<p class="subtitle">
آرشیو اختصاصی آهنگ‌های ستاره و فرانک
</p>


<div class="card">
<h2>🎧 آهنگ اول</h2>

<audio controls>
<source src="song1.mp3" type="audio/mpeg">
</audio>

</div>


<div class="card">
<h2>🎧 آهنگ دوم</h2>

<audio controls>
<source src="song2.mp3" type="audio/mpeg">
</audio>

</div>


<div class="footer">
© 2026 SF Melody
</div>

</body>
</html>
